[tox]
envlist =
    py313-pydantic2
;    py313-pydantic1
    py312-pydantic2
;    py312-pydantic1
    py311-pydantic2
    py311-pydantic1
    py310-pydantic2
    py310-pydantic1

;    py39-pydantic1
;    py39-pydantic2

[testenv]
allowlist_externals = *
;skip_install = true

deps =
    pytest
    pytest-asyncio
    httpx
;    pydantic1: pydantic>=1.10.13,<2.0.0
;    pydantic2: pydantic>=2.0.0,<3.0.0
commands =
    pytest

commands_pre=
    pip install poetry
    poetry lock --no-update
    poetry install --with dev -E pydantic-settings


[testenv:py39-pydantic1]
commands_pre=
    pip install "pydantic==1.10.13" --upgrade

basepython = python3.9



