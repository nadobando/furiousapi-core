[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "furiousapi-core"
version = "0.1.0-dev.1"
description = "FastAPI & FuriousAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9.5,<=3.13"
authors = [
    { name = "nadobando", email = "7695172+nadobando@users.noreply.github.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Framework :: FastAPI",
    "Topic :: Software Development",
    "Topic :: Database",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Typing :: Typed"
]
dependencies = [
    "anyio>=4.0.0,<5",
    "fastapi>=0.100.0,<0.116",
    "lark>=1.0",
    "pydantic>=1.10.13,<3.0.0",
]

[project.optional-dependencies]
pydantic-settings = ["pydantic-settings"]

[project.urls]
Homepage = "https://github.com/nadobando/furiousapi"
Repository = "https://github.com/nadobando/furiousapi"
Documentation = "https://nadobando.github.io/furiousapi"

[dependency-groups]
dev = [
    # test runner
    "pytest>=7.4.2,<8",
    "pytest-asyncio>=0.20.3,<0.21",
    "pytest-cov>=4.0.0,<5",
    "pytest-xdist[psutil]>=3.2.1,<4",
    "coverage>=7.1.0,<8",
    "httpx>=0.23.3,<0.24",
    # tooling
    "mypy>=1.6,<2",
    "pre-commit>=4,<5",
    # framework extra
    "pydantic-settings",
]

[tool.hatch.build.targets.wheel]
packages = ["furiousapi"]

[tool.autopep8]
aggressive = 3
in-place = true
max_line_length = 120
recursive = true

[tool.bandit.assert_used]
skips = ['**/test_*.py', '**/test_*.py']

[tool.black]
exclude = """
(
  /(
      .eggs
    | .git
    | .hg
    | .mypy_cache
    | .tox
    | .venv
    | venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
"""
include = '\.pyi?$'
line-length = 120
preview = true
target-version = ['py39']

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

[tool.coverage.run]
branch = true
source = [
    "*/furiousapi/*"
]

[tool.isort]
profile = "black"

[tool.mypy]
check_untyped_defs = true
disable_error_code = "no-redef"
exclude = [
    '\.venv'
]
explicit_package_bases = true
# strict = true
plugins = "pydantic.mypy"
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "-ra --cov=furiousapi --cov-report=term-missing"
testpaths = [
    "tests"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv"
]
line-length = 120
target-version = "py38"
lint.ignore = [
    "UP",
    "SIM108",
    "ANN204",
    "D",
    "A003",
    "B008",
    "B905",
    "COM",
    "PLR0913",
    "ANN003",
    "ANN002",
    "EM101",
    "TRY003",
    "UP035",
    "G004",
    "EM102",
    "I001",
    "ANN401",
    "TD",
    "FIX002"
]
lint.select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"furiousapi/api/controllers/base.py" = ["N804"]
"furiousapi/api/controllers/mixins.py" = ["N805"]
"furiousapi/db/controllers/base.py" = ["N804"]
"furiousapi/db/fields.py" = ["N805"]
"furiousapi/db/metaclasses.py" = ["N804"]
"tests/*" = ["ANN201", "S101", "DTZ001", "PLR0913", "S101"]
"example/*" = ["INP001", "ANN201", "BLE001", "B904", "FAST002", "RET504", "TRY300", "SLOT000"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
version_variables = [
    "furiousapi/core/__init__.py:__version__"
]

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^ci:.*",
    "^(?!feat:|fix:|perf:|refactor:).*$"
]

[tool.semantic_release.publish]
upload_to_vcs_release = false
